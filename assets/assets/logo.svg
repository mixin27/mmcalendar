<svg viewBox="0 0 200 200"
    xmlns="http://www.w3.org/2000/svg">
    <!-- Background with gradient -->
    <defs>
        <linearGradient id="bgGradientHybrid" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#8474C4;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#6750A4;stop-opacity:1" />
        </linearGradient>

        <linearGradient id="moonGradientHybrid" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#F5F0FF;stop-opacity:0.95" />
        </linearGradient>

        <filter id="softGlow">
            <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <filter id="subtleShadow">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.25"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Rounded square background -->
    <rect width="200" height="200" rx="45" fill="url(#bgGradientHybrid)"/>

    <!-- Outer ring (from yin-yang option) -->
    <circle cx="100" cy="100" r="55" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.3"/>

    <!-- Calendar tick marks around circle (like option 3) -->
    <g stroke="#FFFFFF" stroke-width="2" opacity="0.25" stroke-linecap="round">
        <line x1="100" y1="38" x2="100" y2="45"/>
        <line x1="145" y1="55" x2="140" y2="60"/>
        <line x1="162" y1="100" x2="155" y2="100"/>
        <line x1="145" y1="145" x2="140" y2="140"/>
        <line x1="100" y1="162" x2="100" y2="155"/>
        <line x1="55" y1="145" x2="60" y2="140"/>
        <line x1="38" y1="100" x2="45" y2="100"/>
        <line x1="55" y1="55" x2="60" y2="60"/>
    </g>

    <!-- Minimalist calendar grid background (from option 4) -->
    <g stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.2">
        <rect x="65" y="70" width="70" height="60" rx="4"/>

        <!-- Horizontal lines -->
        <line x1="65" y1="88" x2="135" y2="88"/>
        <line x1="65" y1="106" x2="135" y2="106"/>

        <!-- Vertical lines -->
        <line x1="88" y1="70" x2="88" y2="130"/>
        <line x1="112" y1="70" x2="112" y2="130"/>
    </g>

    <!-- Main crescent moon (from option 1) with shadow -->
    <g filter="url(#subtleShadow)">
        <!-- Full moon circle -->
        <circle cx="100" cy="100" r="32" fill="url(#moonGradientHybrid)"/>

        <!-- Shadow to create crescent -->
        <circle cx="108" cy="96" r="32" fill="url(#bgGradientHybrid)"/>
    </g>

    <!-- Celestial star accent (from option 4) with glow -->
    <g filter="url(#softGlow)">
        <path d="M 120 85 L 122 90 L 127 90.5 L 123 94 L 124.5 99 L 120 96 L 115.5 99 L 117 94 L 113 90.5 L 118 90 Z" fill="#FFFFFF" opacity="0.85"/>
    </g>

    <!-- Small decorative stars/dots -->
    <g fill="#FFFFFF">
        <circle cx="75" cy="80" r="2" opacity="0.6"/>
        <circle cx="130" cy="120" r="2.5" opacity="0.7"/>
        <circle cx="70" cy="120" r="1.8" opacity="0.5"/>
        <circle cx="125" cy="75" r="1.5" opacity="0.5"/>
    </g>

    <!-- Curved accent at bottom (inspired by option 2) -->
    <path d="M 75 140 Q 100 148, 125 140" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>
</svg>
