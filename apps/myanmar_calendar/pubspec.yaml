name: mmcalendar
description: "Myanmar Calendar Application"
publish_to: 'none'
version: 2.2.3+223
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core packages
  shared_core:
    path: ../../packages/shared/core
  shared_ui_kit:
    path: ../../packages/shared/ui_kit
  shared_localizations:
    path: ../../packages/shared/localizations
  integrations_database:
    path: ../../packages/integrations/database
  integrations_firebase:
    path: ../../packages/integrations/firebase
  integrations_app_update:
    path: ../../packages/integrations/app_update

  # Features
  calendar:
    path: ../../packages/features/calendar
  settings:
    path: ../../packages/features/settings
  views:
    path: ../../packages/features/views
  converter:
    path: ../../packages/features/converter
  calendar_generation:
    path: ../../packages/features/calendar_generation
  events:
    path: ../../packages/features/events
  home_widgets:
    path: ../../packages/features/home_widgets
  telegram_web:
    path: ../../packages/integrations/telegram_web
  promo:
    path: ../../packages/features/promo
  holidays:
    path: ../../packages/features/holidays

  # Myanmar calendar
  myanmar_calendar_dart: ^2.0.1
  flutter_mmcalendar: ^3.3.1

  # State management
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1

  # Dependency injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Navigation
  go_router: ^18.0.1

  # Utilites
  intl: ^0.20.3
  timezone: ^0.11.1
  cupertino_icons: ^1.0.9
  equatable: ^2.1.0
  url_launcher: ^6.3.2
  home_widget: ^0.9.4
  shared_preferences: ^2.5.5
  workmanager: ^0.10.0
  flutter_svg: ^2.3.0

  # Firebase
  firebase_core: ^4.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner:
  injectable_generator: ^3.1.3
  build_version:

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/google_fonts/
    - assets/images/
    - assets/branding/
