name: mmcalendar
description: "Myanmar Calendar Application"
publish_to: 'none'
version: 2.1.5+209
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core packages
  core:
    path: ../../packages/core
  data:
    path: ../../packages/data
  localizations:
    path: ../../packages/localizations

  # Features
  calendar:
    path: ../../packages/features/calendar
  settings:
    path: ../../packages/features/settings
  views:
    path: ../../packages/features/views
  converter:
    path: ../../packages/features/converter
  events:
    path: ../../packages/features/events
  home_widgets:
    path: ../../packages/features/home_widgets
  firebase_analytics_app:
    path: ../../packages/features/firebase_analytics_app
  telegram_web:
    path: ../../packages/integrations/telegram_web
  promo:
    path: ../../packages/features/promo
  app_remote_config:
    path: ../../packages/app_remote_config
  holidays:
    path: ../../packages/features/holidays

  # Myanmar calendar
  flutter_mmcalendar: ^3.2.8

  # State management
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1

  # Dependency injection
  get_it: ^8.2.0
  injectable: ^2.5.2

  # Navigation
  go_router: ^16.2.4

  # Utilites
  intl: ^0.20.2
  timezone: ^0.10.1
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  url_launcher: ^6.3.2
  home_widget: ^0.8.0
  shared_preferences: ^2.5.3
  workmanager: ^0.8.0
  flutter_svg: ^2.2.1

  # Firebase
  firebase_core: ^4.1.1

  app_update_manager: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.8.0
  injectable_generator: ^2.9.0
  build_version: ^2.1.3

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/google_fonts/
    - assets/images/
    - assets/logo.svg
