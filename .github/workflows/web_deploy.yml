name: Deploy web app

# Builds the Flutter web app here and uploads build/web to Vercel. The Vercel
# project is not connected to Git, so Vercel never tries to build Flutter.
# See docs/architecture/web_app_deploy.md.
#
# Deploys release tags only (v2.7.1, ...), never on pushes or PRs. To
# redeploy, run it by hand from the Actions tab and pick the tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version local builds use. 3.50 deprecates
          # package:flutter/material.dart (use material_ui); upgrade the
          # pin with that migration.
          channel: 'stable'
          flutter-version: 3.50.0

      - name: Install Dependencies
        run: flutter pub get

      - name: Code Generation
        run: |
          # Run build_runner for all packages in the workspace that have build_runner as a dependency
          git ls-files '**/pubspec.yaml' | xargs grep -l "build_runner" | xargs -I {} dirname {} | while read dir; do
            echo "Building in $dir..."
            (cd "$dir" && dart run build_runner build)
          done

      - name: Create firebase_options.dart from secret
        run: echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 -d > apps/myanmar_calendar/lib/firebase_options.dart

      # Static font instances for Calendar Studio's vector PDF, served from
      # /export-fonts/ and downloaded only when someone exports.
      - name: Generate export fonts
        run: |
          python3 -m pip install --quiet fonttools
          python3 packages/features/calendar_studio/tool/build_export_fonts.py apps/myanmar_calendar/web/export-fonts

      - name: Build Web
        run: |
          cd apps/myanmar_calendar
          flutter build web --release --base-href "/"

      # web/vercel.json (copied into build/web) holds the SPA rewrite and
      # cache headers.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@65.12.1
          url=$(vercel deploy apps/myanmar_calendar/build/web --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
