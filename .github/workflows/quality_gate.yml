name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create firebase_options.dart from secret
        run: echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 -d > apps/myanmar_calendar/lib/firebase_options.dart

      - name: Run Workspace Code Generation
        run: |
          flutter pub get
          ./scripts/codegen_all.sh

      - name: Run Analyzer and Architecture Guardrails
        env:
          SKIP_PUB_GET: '1'
        run: ./scripts/analyze_all.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create firebase_options.dart from secret
        run: echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 -d > apps/myanmar_calendar/lib/firebase_options.dart

      - name: Run Workspace Code Generation
        run: |
          flutter pub get
          ./scripts/codegen_all.sh

      - name: Run Test Suite and Architecture Guardrails
        env:
          SKIP_PUB_GET: '1'
        run: ./scripts/test_all.sh
