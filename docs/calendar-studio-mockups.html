<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar Studio · Design mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Noto+Serif+Myanmar:wght@400;600;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0E6B5C; --on-primary:#fff;
  --bg:#F4F7F5; --surface:#fff; --surface-2:#EDF2EF; --surface-3:#E1E8E4; --scrim:rgba(10,20,18,.46);
  --ink:#15201D; --ink-2:#465753; --ink-3:#74847F; --line:#D5DEDA;
  --holiday:#B8322A; --gold:#B98A25; --ok:#1E8A57; --warn:#A96300; --err:#C0352B;
  --board:#DFE6E2; --board-ink:#15201D; --board-2:#CDD7D2;
  --f-ui:'Instrument Sans','Noto Sans Myanmar','Padauk','Myanmar Text',system-ui,sans-serif;
  --f-serif:'Fraunces','Noto Serif Myanmar','Padauk',Georgia,serif;
  --primary-c:color-mix(in srgb,var(--primary) 11%,var(--surface));
  --primary-c2:color-mix(in srgb,var(--primary) 20%,var(--surface));
  --on-primary-c:color-mix(in srgb,var(--primary) 78%,#000);
}
html[data-theme=dark]{
  --bg:#0D1412; --surface:#151E1C; --surface-2:#1C2725; --surface-3:#26332F; --scrim:rgba(0,0,0,.6);
  --ink:#E4EEEB; --ink-2:#A3B3AE; --ink-3:#7A8A85; --line:#2A3835;
  --holiday:#F2857B; --gold:#E0B04E; --ok:#5CC994; --warn:#E6A445; --err:#F28B82;
  --board:#060B0A; --board-ink:#E4EEEB; --board-2:#16201E; --on-primary:#06201B;
  --on-primary-c:color-mix(in srgb,var(--primary) 70%,#fff);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--board);color:var(--board-ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.ic{display:block;flex:none}

/* ---------- board chrome ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:26px 18px 24px 22px;border-right:1px solid color-mix(in srgb,var(--board-ink) 12%,transparent);display:flex;flex-direction:column;gap:22px}
.side .brand{display:flex;gap:12px;align-items:center}
.side .logo{width:38px;height:38px;border-radius:11px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.side h1{font:600 17px/1.2 var(--f-serif);margin:0;letter-spacing:-.005em}
.side .v{font-size:12px;opacity:.65}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{color:inherit;text-decoration:none;font-size:14px;padding:7px 10px;border-radius:9px;opacity:.78}
.side nav a:hover{background:color-mix(in srgb,var(--board-ink) 8%,transparent);opacity:1}
.side .ctl{display:flex;flex-direction:column;gap:14px;margin-top:auto}
.side .ctl p{margin:0 0 6px;font-size:12px;font-weight:600;opacity:.75}
.side .seg{background:transparent}
.swatches{display:flex;gap:8px}
.swatches button{width:26px;height:26px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.swatches button.on{outline:2px solid var(--board-ink);outline-offset:2px}
.main{padding:44px 52px 140px;max-width:1560px}
.hero h1{font:600 clamp(34px,4.4vw,54px)/1.06 var(--f-serif);margin:0 0 14px;letter-spacing:-.02em;max-width:16ch}
.hero p{max-width:60ch;margin:0;font-size:16.5px;opacity:.82}
.sec{margin-top:88px;scroll-margin-top:24px}
.sec>h2{font:600 30px/1.15 var(--f-serif);margin:0 0 8px;letter-spacing:-.012em}
.sec>.lead{max-width:66ch;margin:0 0 30px;opacity:.8}
.row{display:flex;flex-wrap:wrap;gap:34px 30px;align-items:flex-start}
.fr{width:376px;flex:none}
.fr.wide{width:100%;max-width:1180px}
.fr.mid{width:min(100%,860px)}
.fr .cap{display:flex;gap:10px;align-items:center;margin:0 0 4px 4px}
.fr .n{width:22px;height:22px;border-radius:50%;background:var(--board-ink);color:var(--board);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.fr .t{font-weight:600;font-size:14.5px}
.fr .note{margin:0 4px 12px 36px;font-size:13px;opacity:.72;max-width:44ch;line-height:1.45}
.fr.wide .note,.fr.mid .note{max-width:80ch}
.fr.sm{width:300px}
.fr.sm .note{max-width:30ch}

/* flow map */
.flow{display:flex;flex-wrap:wrap;gap:10px 0;align-items:stretch;margin:34px 0 10px}
.fn{background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;min-width:132px;max-width:150px;box-shadow:0 0 0 1px var(--line)}
.fn b{display:block;font-size:13.5px}
.fn span{display:block;font-size:12px;color:var(--ink-3);line-height:1.35;margin-top:2px}
.fa{width:26px;display:grid;place-items:center;color:var(--ink-3);opacity:.9}
.fa svg{stroke:var(--board-ink);opacity:.5}
.flow2{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.flow2 .fn{background:transparent;color:var(--board-ink);box-shadow:0 0 0 1px color-mix(in srgb,var(--board-ink) 22%,transparent);max-width:none;min-width:0;flex:1 1 200px}
.flow2 .fn span{color:inherit;opacity:.7}
.proto-wrap{display:flex;gap:44px;flex-wrap:wrap;align-items:flex-start;margin-top:26px}
.steps{list-style:none;margin:0;padding:0;width:300px;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:9px 12px;border-radius:12px;opacity:.55;transition:opacity .2s,background .2s}
.steps li b{display:block;font-size:14px}
.steps li span{font-size:12.5px;line-height:1.4;display:block}
.steps li i{font-style:normal;width:22px;height:22px;flex:none;border-radius:50%;background:color-mix(in srgb,var(--board-ink) 16%,transparent);display:grid;place-items:center;font-size:11.5px;font-weight:700;margin-top:1px}
.steps li.on{opacity:1;background:color-mix(in srgb,var(--board-ink) 8%,transparent)}
.steps li.on i{background:var(--primary);color:var(--on-primary)}
.steps li.done{opacity:.85}
.proto-tip{font-size:13px;opacity:.75;max-width:300px;margin:12px 4px 0}
.proto-tip button{margin-top:10px}

/* ---------- device ---------- */
.phone{width:376px;padding:8px;border-radius:40px;background:#0b1211;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 26px 50px -22px rgba(4,16,12,.5)}
.scr{position:relative;width:360px;height:740px;background:var(--bg);color:var(--ink);border-radius:32px;overflow:hidden;display:flex;flex-direction:column;font-size:13.5px;line-height:1.45;font-family:var(--f-ui)}
.scr.short{height:auto}
.sb{height:26px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:2px 20px 0 22px;font-size:12px;font-weight:600}
.sb .r{display:flex;gap:5px;align-items:center}
.gest{height:18px;flex:none;display:grid;place-items:center}
.gest::after{content:"";width:108px;height:4px;border-radius:2px;background:var(--ink);opacity:.8}
.body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;min-height:0;overflow:hidden}
.pad{padding:0 16px}
.gap8{height:8px;flex:none}.gap12{height:12px;flex:none}.gap16{height:16px;flex:none}
.spacer{flex:1}

.appbar{height:56px;flex:none;display:flex;align-items:center;gap:2px;padding:0 6px 0 4px}
.appbar .tt{flex:1;min-width:0;padding:0 4px}
.appbar h1{font-size:18.5px;font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sub{font-size:11.5px;color:var(--ink-3);font-weight:500;line-height:1.2;display:flex;align-items:center;gap:4px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:none;border:0;cursor:pointer;flex:none;position:relative;padding:0}
.ib:hover{background:var(--surface-3)}
.ib.tonal{background:var(--primary-c2);color:var(--on-primary-c)}
.ib.dis{opacity:.36;pointer-events:none}
.btn{height:40px;padding:0 18px;border-radius:20px;border:0;font:600 13.5px var(--f-ui);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;background:var(--primary);color:var(--on-primary);white-space:nowrap;position:relative}
.btn.tonal{background:var(--primary-c2);color:var(--on-primary-c)}
.btn.out{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1px var(--line)}
.btn.txt{background:none;color:var(--primary);padding:0 10px}
.btn.danger{background:var(--err);color:#fff}
.btn.full{width:100%}.btn.lg{height:48px;border-radius:24px;font-size:14.5px}.btn.sm{height:32px;padding:0 14px;font-size:12.5px;border-radius:16px}
.btn.dis{opacity:.4;pointer-events:none}
.chip{height:32px;padding:0 12px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--line);display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:12.5px;color:var(--ink-2);background:transparent;cursor:pointer;white-space:nowrap;border:0;font-family:inherit}
.chip.on{background:var(--primary-c2);color:var(--on-primary-c);box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.nw{flex-wrap:nowrap;overflow:hidden}
.seg{display:flex;border-radius:20px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;background:transparent}
.seg>*{flex:1;height:36px;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:500;font-size:12.5px;color:var(--ink-2);cursor:pointer;border-left:1px solid var(--line);white-space:nowrap;padding:0 6px}
.seg>*:first-child{border-left:0}
.seg>.on{background:var(--primary-c2);color:var(--on-primary-c)}
.seg.sm>*{height:30px;font-size:12px}
.sw{width:46px;height:26px;border-radius:13px;background:var(--surface-3);box-shadow:inset 0 0 0 2px var(--ink-3);position:relative;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;left:5px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--ink-3);transition:all .15s}
.sw.on{background:var(--primary);box-shadow:none}
.sw.on::after{left:23px;top:3px;width:20px;height:20px;background:var(--on-primary)}
.cb{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--ink-3);display:grid;place-items:center;color:transparent;flex:none;cursor:pointer}
.cb.on{background:var(--primary);box-shadow:none;color:var(--on-primary)}
.rd{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink-3);flex:none;position:relative}
.rd.on{box-shadow:inset 0 0 0 2px var(--primary)}
.rd.on::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--primary)}
.card{background:var(--surface);border-radius:16px;box-shadow:0 0 0 1px var(--line);position:relative}
.card.f{background:var(--surface-2);box-shadow:none}
.card.pc{background:var(--primary-c);box-shadow:none}
.lbl{font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
.mut{color:var(--ink-3)}.sm12{font-size:12px}.sm11{font-size:11.5px}
.b6{font-weight:600}
.rowf{display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:48px}
.rowf .t{font-weight:500;font-size:13.5px;line-height:1.3}
.rowf .s{font-size:12px;color:var(--ink-3);line-height:1.3}
.rowf .g{flex:1;min-width:0}
.rowf+.rowf{border-top:1px solid var(--line)}
.ico{width:36px;height:36px;border-radius:12px;background:var(--primary-c);color:var(--on-primary-c);display:grid;place-items:center;flex:none}
.ico.s{width:30px;height:30px;border-radius:10px}
.field{min-height:46px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;background:var(--surface)}
.field.foc{box-shadow:inset 0 0 0 2px var(--primary)}
.slider{height:4px;border-radius:2px;background:var(--surface-3);position:relative;margin:9px 0}
.slider i{position:absolute;left:0;top:0;bottom:0;background:var(--primary);border-radius:2px}
.slider b{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--primary);transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.badge{height:20px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.badge.ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.badge.err{background:color-mix(in srgb,var(--err) 16%,var(--surface));color:var(--err)}
.badge.pri{background:var(--primary-c2);color:var(--on-primary-c)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);z-index:6;display:flex;flex-direction:column;overflow:hidden}
.sheet .h{width:32px;height:4px;border-radius:2px;background:var(--ink-3);opacity:.5;margin:10px auto 4px;flex:none}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:6px 16px 10px}
.sheet .hd h2{font-size:17px;font-weight:600;margin:0;flex:1;letter-spacing:-.01em;line-height:1.3}
.sheet .in{flex:1;min-height:0;overflow:hidden;padding:0 16px 12px}
.sheet .ft{padding:10px 16px 12px;border-top:1px solid var(--line);flex:none;background:var(--surface)}
.dlg{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);background:var(--surface);border-radius:28px;padding:22px 22px 16px;z-index:6;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.dlg h2{margin:0 0 8px;font-size:19px;font-weight:600;line-height:1.3}
.dlg p{margin:0 0 18px;color:var(--ink-2);font-size:13.5px}
.dlg .ac{display:flex;justify-content:flex-end;gap:6px}
.toast{position:absolute;left:12px;right:12px;bottom:14px;background:#22302D;color:#EAF3F0;border-radius:12px;padding:12px 8px 12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:7;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:13px}
.toast b{color:#8DE8D1;padding:6px 12px;font-weight:600}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:12.5px;line-height:1.4}
.banner.warn{background:color-mix(in srgb,var(--warn) 13%,var(--surface));color:var(--ink)}
.banner.err{background:color-mix(in srgb,var(--err) 13%,var(--surface))}
.banner.info{background:var(--primary-c)}
.banner b{display:block;font-size:13px;margin-bottom:1px}
.tip{position:absolute;z-index:8;right:8px;top:8px;width:206px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.tip::before{content:"";position:absolute;right:16px;top:-6px;width:12px;height:12px;background:var(--ink);transform:rotate(45deg);border-radius:2px}
.tip b{display:block;font-size:13.5px;margin-bottom:2px}
.tip u{display:block;text-decoration:none;margin-top:8px;font-weight:600;color:color-mix(in srgb,var(--primary) 45%,#fff)}

/* navigation bar */
.nav{height:68px;flex:none;background:var(--surface-2);display:flex;padding:8px 6px 10px}
.nav>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--ink-2)}
.nav .p{width:56px;height:28px;border-radius:14px;display:grid;place-items:center}
.nav .on{color:var(--ink);font-weight:600}
.nav .on .p{background:var(--primary-c2);color:var(--on-primary-c)}
.fab{position:absolute;right:16px;bottom:22px;height:56px;padding:0 20px 0 16px;border-radius:18px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:3;cursor:pointer;border:0;font-family:inherit}

/* project cards */
.pcard{padding:8px 8px 10px}
.pcard .th{height:132px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.pcard .th .pgw{box-shadow:0 3px 10px rgba(0,0,0,.2)}
.pcard .nm{font-weight:600;font-size:13px;margin:8px 4px 0;line-height:1.3;display:flex;justify-content:space-between;gap:4px}
.pcard .mt{font-size:11.5px;color:var(--ink-3);margin:1px 4px 0;line-height:1.35}
.tcard{padding:8px 8px 10px;cursor:pointer}
.tcard .th{height:176px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.tcard .th .pgw{box-shadow:0 3px 10px rgba(0,0,0,.22)}
.tcard .nm{font-weight:600;font-size:13px;margin:8px 4px 0}
.tcard .mt{font-size:11.5px;color:var(--ink-3);margin:1px 4px 0}
.tcard.blank .th{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-3)}

/* ---------- editor ---------- */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--surface-3);background-image:radial-gradient(color-mix(in srgb,var(--ink) 16%,transparent) 1px,transparent 1.2px);background-size:16px 16px}
.paper{position:absolute;left:50%;transform:translateX(-50%);box-shadow:0 10px 30px rgba(0,0,0,.24),0 0 0 1px rgba(0,0,0,.05);background:#fff}
.ctx{position:absolute;left:50%;transform:translateX(-50%);height:38px;border-radius:19px;background:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.25),0 0 0 1px var(--line);display:flex;align-items:center;padding:0 4px;gap:0;z-index:3;color:var(--ink)}
.ctx span{width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.ctx span.dg{color:var(--err)}
.ctx i{width:1px;height:18px;background:var(--line)}
.pgpill{position:absolute;left:50%;transform:translateX(-50%);top:10px;height:30px;padding:0 6px;border-radius:15px;background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;gap:2px;font-size:12px;font-weight:600;z-index:3}
.pgpill svg{color:var(--ink-2)}
.zoomchip{position:absolute;left:12px;bottom:10px;height:28px;padding:0 10px;border-radius:14px;background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px;z-index:3}
.tools{height:60px;flex:none;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:0 6px}
.tools>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--ink-2)}
.tools .on{color:var(--primary)}
.isheet{flex:none;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.14);position:relative;z-index:2;display:flex;flex-direction:column;overflow:hidden}
.isheet .h{width:32px;height:4px;border-radius:2px;background:var(--ink-3);opacity:.5;margin:8px auto 2px;flex:none}
.ihd{display:flex;align-items:center;gap:10px;padding:4px 12px 6px 16px}
.ihd b{font-size:14.5px;font-weight:600;flex:1;line-height:1.2}
.ihd small{display:block;font-size:11.5px;font-weight:500;color:var(--ink-3)}
.ihd .ib{width:34px;height:34px}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px;flex:none}
.tabs>div{flex:1;height:38px;display:grid;place-items:center;font-weight:600;font-size:12.5px;color:var(--ink-3);cursor:pointer;position:relative}
.tabs>div.on{color:var(--primary)}
.tabs>div.on::after{content:"";position:absolute;left:24%;right:24%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}
.pane{display:none}.pane.on{display:block}
.ibody{flex:1;min-height:0;overflow:hidden;padding:10px 16px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px}
.prow .t{font-weight:500;font-size:13px}
.prow .s{font-size:11.5px;color:var(--ink-3)}
.swc{display:flex;gap:9px}
.swc i{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16);display:block}
.swc i.on{outline:2px solid var(--primary);outline-offset:2px}
.fchip{padding:6px 10px 6px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);min-width:84px;flex:none}
.fchip.on{box-shadow:inset 0 0 0 2px var(--primary);background:var(--primary-c)}
.fchip b{display:block;font-size:19px;line-height:1.7;font-weight:500;white-space:nowrap}
.fchip span{font-size:10.5px;color:var(--ink-3);display:flex;align-items:center;gap:3px;line-height:1.2}
.meter{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:3px}
.lrow{display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 4px;border-radius:12px}
.lrow.on{background:var(--primary-c2)}
.lrow .nmx{flex:1;font-weight:500;font-size:13.5px;line-height:1.25}
.lrow .nmx small{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3)}
.lrow .ib{width:36px;height:36px}
.lrow.hid .nmx{opacity:.5}
.tile{border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);padding:12px;display:flex;gap:10px;align-items:flex-start;background:var(--surface);position:relative}
.tile b{font-size:13px;display:block;line-height:1.2}
.tile span.d{font-size:11.5px;color:var(--ink-3);line-height:1.3;display:block;margin-top:2px}
.deco{aspect-ratio:1;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.deco.on{box-shadow:inset 0 0 0 2px var(--primary);background:var(--primary-c)}
.photo{aspect-ratio:1;border-radius:8px;position:relative;overflow:hidden}
.photo .cb{position:absolute;right:5px;top:5px;background:rgba(255,255,255,.9);color:transparent}
.issue{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--surface-2);margin-bottom:8px}
.issue .sev{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.issue .sev.warn{background:var(--warn)}.issue .sev.err{background:var(--err)}.issue .sev.info{background:var(--ink-3)}
.issue h4{margin:0;font-size:13.5px;line-height:1.3}
.issue p{margin:2px 0 8px;font-size:12px;color:var(--ink-2);line-height:1.4}
.issue .ac{display:flex;gap:6px}
.pcell{aspect-ratio:.72;border-radius:4px;position:relative;overflow:hidden;background:var(--surface-2)}
.prog{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.prog i{display:block;height:100%;border-radius:3px;background:var(--primary);transition:width .4s}

/* ---------- desktop ---------- */
.win{border-radius:14px;overflow:hidden;background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 18%,transparent),0 30px 60px -28px rgba(4,16,12,.5);font-size:13.5px;line-height:1.45;position:relative}
.win .tb{height:40px;background:var(--surface-2);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:12px;color:var(--ink-3)}
.win .tb i{width:11px;height:11px;border-radius:50%;background:var(--surface-3);display:block}
.ed{display:grid;grid-template-columns:60px 252px minmax(0,1fr) 300px;grid-template-rows:56px minmax(0,1fr) 30px;height:640px}
.ed .top{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 10px 0 8px;border-bottom:1px solid var(--line);background:var(--surface)}
.ed .rail{background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.ed .rail>div{width:48px;padding:6px 0 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--ink-2)}
.ed .rail>div.on{background:var(--primary-c2);color:var(--on-primary-c)}
.ed .lp{background:var(--surface);border-right:1px solid var(--line);padding:12px 10px;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.ed .rp{background:var(--surface);border-left:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.ed .cv{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.ed .strip{height:112px;flex:none;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;padding:10px 12px;overflow:hidden;align-items:flex-start}
.ed .strip .th{flex:none;text-align:center;font-size:10.5px;color:var(--ink-3);font-weight:500}
.ed .strip .th .pgw{box-shadow:0 1px 4px rgba(0,0,0,.25);display:block;margin:0 auto 3px;border-radius:2px;overflow:hidden}
.ed .strip .th.on .pgw{outline:2px solid var(--primary);outline-offset:1px}
.ed .strip .th.on{color:var(--primary);font-weight:700}
.ed .stat{grid-column:1/-1;background:var(--surface-2);display:flex;align-items:center;gap:16px;padding:0 14px;font-size:11.5px;color:var(--ink-2)}
.ed .stat kbd{font:600 10.5px var(--f-ui);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:5px;padding:1px 5px;margin-right:4px}
.ed .stat .sp{flex:1}
.sechd{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;margin:2px 4px 0}
.tip-k{position:absolute;padding:5px 9px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:11.5px;z-index:9}
.dlgbox{position:absolute;inset:44px 60px;background:var(--surface);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:grid;grid-template-columns:minmax(0,1fr) 340px;overflow:hidden;z-index:6}
.dlgbox .l{background:var(--surface-2);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.dlgbox .r{padding:20px 22px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.pgrid .pc{position:relative;text-align:center;font-size:10.5px;color:var(--ink-3);font-weight:500}
.pgrid .pc .pgw{display:block;margin:0 auto 3px;box-shadow:0 2px 6px rgba(0,0,0,.25);border-radius:2px;overflow:hidden}
.pgrid .pc .fl{position:absolute;top:-5px;right:calc(50% - 40px);width:16px;height:16px;border-radius:50%;background:var(--warn);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
.preset{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.preset.on{box-shadow:inset 0 0 0 2px var(--primary);background:var(--primary-c)}
.preset b{font-size:13.5px;display:block;line-height:1.25}
.preset span.d{font-size:11.5px;color:var(--ink-3);display:block;line-height:1.3}
.railnav{width:96px;flex:none;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:8px}
.railnav .lead{width:76px;padding:10px 4px 8px;border-radius:16px;background:var(--primary);color:var(--on-primary);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;text-align:center;line-height:1.2;margin-bottom:10px;position:relative}
.railnav .it{width:76px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--ink-2);padding:2px 0}
.railnav .it .p{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.railnav .it.on{color:var(--ink);font-weight:600}
.railnav .it.on .p{background:var(--primary-c2);color:var(--on-primary-c)}

/* tokens page */
.tok{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tokc{background:var(--surface);color:var(--ink);border-radius:16px;padding:16px;box-shadow:0 0 0 1px var(--line)}
.tokc h3{margin:0 0 10px;font-size:14px}
.tokc .sw2{display:flex;align-items:center;gap:10px;font-size:12.5px;margin:6px 0}
.tokc .sw2 i{width:28px;height:28px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);flex:none}
.tokc .sw2 span{color:var(--ink-3);font-size:11.5px;margin-left:auto}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:20px}
.rule{padding:16px 18px;border-radius:16px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--board-ink) 20%,transparent)}
.rule b{display:block;margin-bottom:4px;font-size:14.5px}
.rule p{margin:0;font-size:13.5px;opacity:.78;line-height:1.5}

/* ---------- calendar artwork ---------- */
.pgw{position:relative;flex:none}
.pgs{position:absolute;left:0;top:0;transform-origin:0 0}
.pg{position:relative;overflow:hidden;background:var(--pb,#fff);color:var(--pi,#14201D);font-family:'Instrument Sans','Noto Sans Myanmar','Padauk',sans-serif;line-height:1.25;--pl:rgba(20,32,29,.14)}
.pg *{box-sizing:border-box}
.pg .abs{position:absolute}
.pg svg{display:block}
.cg{display:grid;grid-template-columns:repeat(7,1fr);width:100%;height:100%}
.cg .wh{display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:700;font-size:10.5px;line-height:1.2}
.cg .wh em{font-style:normal;font-weight:500;font-size:8px;opacity:.65}
.cg .wh.su{color:var(--ph)}
.cg .c{position:relative;padding:5px 6px;border-top:1px solid var(--pl);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;min-width:0}
.cg .c b{font:700 15px/1 'Fraunces','Noto Serif Myanmar',serif}
.cg .c i{font-style:normal;font-size:8.5px;opacity:.72;align-self:flex-end;line-height:1.5;white-space:nowrap}
.cg .c.su b,.cg .c.ho b{color:var(--ph)}
.cg .c.ho{background:color-mix(in srgb,var(--ph) 8%,transparent)}
.cg .c.sb i{color:var(--pgd,#8E6512);opacity:1;font-weight:700}
.cg .c u{position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%}
.cg .c u.full{background:var(--pg)}
.cg .c u.new{box-shadow:inset 0 0 0 1.5px currentColor;opacity:.55}
.cg .c s{position:absolute;left:6px;bottom:6px;width:14px;height:3px;border-radius:2px;background:var(--pc)}
.cg.mini .c{padding:0;border:0;align-items:center;justify-content:center;background:none!important}
.cg.mini .c b{font:600 7.4px/1 'Instrument Sans',sans-serif}
.cg.mini .wh{font-size:6px;opacity:.7}
.cg.ap{--pc:var(--primary);--pi:var(--ink);--pg:var(--gold);--ph:var(--holiday);--pgd:var(--gold)}
.cg.ap .wh{font-size:11px;color:var(--ink-3);font-weight:600}
.cg.ap .wh.su{color:var(--holiday)}
.cg.ap .c{border:0;align-items:center;justify-content:flex-start;gap:0;padding:3px 0 0;background:none!important}
.cg.ap .c b{font:600 14.5px/1.35 var(--f-ui)}
.cg.ap .c i{align-self:center;font-size:9px;opacity:.6;min-height:12px;line-height:1.3}
.cg.ap .c u{right:9px;top:5px;width:6px;height:6px}
.cg.ap .c s{left:50%;bottom:0;transform:translateX(-50%);width:4px;height:4px;border-radius:50%}
.cg.ap .c.today b{background:var(--primary);color:var(--on-primary);width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.cg.ap .c.pick{background:var(--primary-c)!important;border-radius:10px}

.jade{--pc:#0E6B5C;--pi:#12201D;--pg:#D9A93A;--pgd:#8A6210;--ph:#B8322A;--pb:#FBFDFC}
.jade .mmT{font:700 44px/1.55 'Noto Serif Myanmar','Fraunces',serif;color:var(--pc);white-space:nowrap}
.jade .enT{font:600 19px/1.2 'Fraunces',serif;letter-spacing:.03em}
.jade .yr{text-align:right}
.jade .yr b{display:block;font:700 34px/1.5 'Noto Serif Myanmar','Fraunces',serif;color:var(--pgd)}
.jade .yr span{font-size:10.5px;opacity:.75}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:8.6px;border-top:1.5px solid var(--pc);padding-top:8px}
.leg span{display:inline-flex;align-items:center;gap:5px;line-height:1.3}
.leg i{display:block;width:8px;height:8px;border-radius:50%}
.selb{position:absolute;outline:calc(2px*var(--k)) solid var(--primary);z-index:20;pointer-events:none}
.selb .hd{position:absolute;width:calc(11px*var(--k));height:calc(11px*var(--k));background:#fff;border:calc(2px*var(--k)) solid var(--primary);border-radius:50%;transform:translate(-50%,-50%)}
.selb .lb{position:absolute;left:0;top:calc(-22px*var(--k));background:var(--primary);color:var(--on-primary);font:600 calc(11px*var(--k))/calc(20px*var(--k)) 'Instrument Sans',sans-serif;padding:0 calc(8px*var(--k));border-radius:calc(5px*var(--k));white-space:nowrap}
.gd{position:absolute;pointer-events:none;z-index:15}
.gd.safe{border:calc(1.2px*var(--k)) dashed #0E9C85}
.gd.bleed{border:calc(1.2px*var(--k)) dashed #E04B3F}

.ledger{--pc:#151B19;--pi:#151B19;--pg:#B98A25;--pgd:#8A6210;--ph:#B8322A;--pb:#fff;--pl:rgba(21,27,25,.2)}
.moonp{--pc:#F5D77E;--pi:#EEF0FF;--pg:#F5D77E;--pgd:#F5D77E;--ph:#FF9C93;--pb:#151B3F;--pl:rgba(238,240,255,.14)}
.storyp{--pc:#fff;--pi:#fff;--pg:#F7D98A;--pgd:#F7D98A;--ph:#FFE2A8;--pb:#7A1620;--pl:rgba(255,255,255,.2)}
.plainp{--pc:#111;--pi:#111;--pg:#111;--pgd:#111;--ph:#111;--pb:#fff;--pl:rgba(0,0,0,.35)}
.plainp .cg .c.su b,.plainp .cg .c.ho b{text-decoration:underline}
.annp{--pc:#0E6B5C;--pi:#12201D;--pg:#D9A93A;--ph:#B8322A;--pb:#FBFDFC}
.mm{font-family:'Noto Serif Myanmar','Fraunces',serif}

@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--primary) 55%,transparent)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.proto .hot{animation:pulse 1.8s ease-out infinite}
.proto [data-go]{cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
@media (prefers-reduced-motion:reduce){.proto .hot,.spin{animation:none}html{scroll-behavior:auto}}
@media (max-width:980px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:column;border:0}.side .ctl{margin-top:0}.main{padding:28px 18px 100px}}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.cg.bx .c{border:.6px solid var(--pl)}
.cg.bx .wh{border-bottom:1.2px solid var(--pc)}
.moonp .cg .c u{display:none}
.moonp .cg .c.fm b{background:#F5D77E;color:#151B3F;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;margin:-4px 0 0 -4px}
.moonp .cg .c.nm b{box-shadow:inset 0 0 0 1.5px rgba(238,240,255,.6);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;margin:-4px 0 0 -4px}
.moonp .cg .c.fm{background:none}
.hotspot{position:absolute;z-index:8}
.tcard .th,.pcard .th{position:relative}
.scr .ib.hot{border-radius:50%}

.sheet .ft{padding-bottom:28px}

/* ---------- board additions ---------- */
.fr{margin:0}
.fr:not(.wide):not(.mid) .note{min-height:58px}
.tok{grid-template-columns:repeat(3,1fr)}.rules{grid-template-columns:repeat(3,1fr)}
@media (max-width:1180px){.tok,.rules{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){.tok,.rules{grid-template-columns:1fr}}
.fr.wide{overflow-x:auto;padding:0 6px 22px 0}
.fr.wide>.win{min-width:1100px}
.hero{padding-top:6px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.hero .meta span{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:999px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--board-ink) 24%,transparent)}
h3.sub{font:600 18px/1.3 var(--f-serif);margin:46px 0 14px;letter-spacing:-.005em;display:flex;align-items:baseline;gap:12px}
h3.sub small{font:500 13px var(--f-ui);opacity:.65}
.sec>h2 .no{display:inline-block;font:700 12px var(--f-ui);letter-spacing:.02em;padding:3px 9px;border-radius:999px;background:var(--board-ink);color:var(--board);vertical-align:middle;margin-right:12px;position:relative;top:-3px}
.side nav a.cur{background:color-mix(in srgb,var(--board-ink) 10%,transparent);opacity:1;font-weight:600}
.side .seg{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--board-ink) 25%,transparent)}
.side .seg>*{border-color:color-mix(in srgb,var(--board-ink) 20%,transparent);color:var(--board-ink);height:32px}
.side .seg>.on{background:var(--board-ink);color:var(--board)}
.side .ctl p.fine{font-size:11.5px;font-weight:400;opacity:.6;line-height:1.45;margin:8px 0 0}
.trace{width:100%;border-collapse:collapse;font-size:13.5px;max-width:1080px}
.trace th{text-align:left;font-size:12px;font-weight:700;padding:8px 14px 8px 0;opacity:.7;border-bottom:1.5px solid var(--board-ink)}
.trace td{padding:11px 14px 11px 0;border-bottom:1px solid color-mix(in srgb,var(--board-ink) 16%,transparent);vertical-align:top;line-height:1.45}
.trace td:first-child{font-weight:600;width:34%}
.trace a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
.trace .ph{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--board-ink) 12%,transparent);white-space:nowrap}
.later{margin-top:26px;max-width:1080px;padding:16px 20px;border-radius:16px;box-shadow:inset 0 0 0 1.5px dashed color-mix(in srgb,var(--board-ink) 30%,transparent);border:1.5px dashed color-mix(in srgb,var(--board-ink) 30%,transparent);box-shadow:none;font-size:13.5px;line-height:1.55}
.later b{display:block;margin-bottom:2px}
.typeb{font-size:12.5px;color:var(--ink-3);margin-top:8px}
.typeb .big{display:block;color:var(--ink);font-size:24px;line-height:1.5;margin-bottom:2px}
.two{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start;margin-top:36px}
.protoh{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-weight:600;font-size:14px}
@media print{.side{display:none}.shell{display:block}}

</style>
</head>
<body>
<div class="shell">
<aside class="side">
 <div class="brand"><div class="logo" id="logo"></div><div><h1>Calendar Studio</h1><div class="v">Design mockups · Release 1</div></div></div>
 <nav id="nav" aria-label="Sections"></nav>
 <div class="ctl">
  <div><p>Theme</p><div class="seg"><div data-mode="light" class="on">Light</div><div data-mode="dark">Dark</div></div></div>
  <div><p>App accent</p><div class="swatches" id="swatches"></div><p class="fine">Accent colours the app chrome. Templates keep their own palettes.</p></div>
 </div>
</aside>
<main class="main" id="main"></main>
</div>

const MM_DIG='၀၁၂၃၄၅၆၇၈၉';
const mmN=n=>String(n).replace(/\d/g,d=>MM_DIG[d]);
const MM_WD=['နွေ','လာ','ဂါ','ဟူး','ကြာ','သော','နေ'];
const EN_WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MM_MONTH=['ဇန်နဝါရီ','ဖေဖော်ဝါရီ','မတ်','ဧပြီ','မေ','ဇွန်','ဇူလိုင်','ဩဂုတ်','စက်တင်ဘာ','အောက်တိုဘာ','နိုဝင်ဘာ','ဒီဇင်ဘာ'];
const EN_MONTH=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MM_LUNAR=['နတ်တော်၊ ပြာသို','ပြာသို၊ တပို့တွဲ','တပို့တွဲ၊ တပေါင်း','တပေါင်း၊ တန်ခူး','တန်ခူး၊ ကဆုန်','ကဆုန်၊ နယုန်','နယုန်၊ ဝါဆို','ဝါဆို၊ ဝါခေါင်','ဝါခေါင်၊ တော်သလင်း','တော်သလင်း၊ သီတင်းကျွတ်','သီတင်းကျွတ်၊ တန်ဆောင်မုန်း','တန်ဆောင်မုန်း၊ နတ်တော်'];
const eraLine=(y,m)=>{const t=y===2027?(m<3?'၁၃၈၈':m===3?'၁၃၈၈–၁၃၈၉':'၁၃၈၉'):'၁၃၈၈';return MM_LUNAR[m]+' '+t;};
const NM=[[2026,0,18],[2026,1,17],[2026,2,19],[2026,3,17],[2026,4,16],[2026,5,15],[2026,6,14],[2026,7,12],[2026,8,11],[2026,9,10],[2026,10,9],[2026,11,9],[2027,0,8],[2027,1,6],[2027,2,8],[2027,3,7],[2027,4,6],[2027,5,4],[2027,6,4],[2027,7,2],[2027,8,1],[2027,9,1],[2027,9,30],[2027,10,29],[2027,11,28],[2028,0,27]].map(a=>Date.UTC(...a));
function lunar(y,m,d){const t=Date.UTC(y,m,d);let i=NM.length-1;while(i>0&&NM[i]>t)i--;return Math.round((t-NM[i])/864e5);}
function mmDay(y,m,d){const L=Math.min(lunar(y,m,d),29);
 if(L===0)return{k:'new',txt:'ကွယ်',long:'လကွယ်'};
 if(L<15)return{k:'wax',n:L,txt:'ဆန်း '+mmN(L),long:'လဆန်း '+mmN(L)};
 if(L===15)return{k:'full',txt:'ပြည့်',long:'လပြည့်'};
 return{k:'wane',n:L-15,txt:'ဆုတ် '+mmN(L-15),long:'လဆုတ် '+mmN(L-15)};}
const isSab=md=>md.k==='new'||md.k==='full'||md.n===8;
const HOL={'0-1':['နှစ်သစ်ကူးနေ့',"New Year's Day"],'0-4':['လွတ်လပ်ရေးနေ့','Independence Day'],'1-12':['ပြည်ထောင်စုနေ့','Union Day'],'2-2':['တောင်သူလယ်သမားနေ့',"Peasants' Day"],'2-27':['တပ်မတော်နေ့','Armed Forces Day'],'3-13':['သင်္ကြန်','Thingyan'],'3-14':['သင်္ကြန်','Thingyan'],'3-15':['သင်္ကြန်','Thingyan'],'3-16':['သင်္ကြန်','Thingyan'],'3-17':['မြန်မာနှစ်သစ်ကူး','Myanmar New Year'],'4-1':['အလုပ်သမားနေ့','Labour Day'],'6-19':['အာဇာနည်နေ့',"Martyrs' Day"],'11-25':['ခရစ်စမတ်နေ့','Christmas Day']};
const EV={'0-12':['မွေးနေ့','Birthday'],'0-19':['အစည်းအဝေး','Team meeting'],'0-30':['မိသားစုညစာ','Family dinner']};

function monthCells(y,m,ws){const first=new Date(Date.UTC(y,m,1)).getUTCDay();const off=(first-ws+7)%7;const dim=new Date(Date.UTC(y,m+1,0)).getUTCDate();const c=[];for(let i=0;i<off;i++)c.push(0);for(let d=1;d<=dim;d++)c.push(d);while(c.length%7)c.push(0);return c;}
function cellHtml(y,m,d,o){
 if(!d)return'<div class="c" style="border-color:transparent"></div>';
 const dow=new Date(Date.UTC(y,m,d)).getUTCDay(),md=mmDay(y,m,d),h=o.hol!==false&&HOL[m+'-'+d],ev=o.ev&&y===2027&&m===0&&EV[m+'-'+d];
 const cls=['c',dow===0?'su':'',h?'ho':'',(o.mm&&isSab(md))?'sb':'',md.k==='full'?'fm':'',md.k==='new'?'nm':'',o.today===d?'today':'',o.pick===d?'pick':''].filter(Boolean).join(' ');
 const num=o.lang==='mm'?mmN(d):d;
 const moon=o.moon&&(md.k==='full'||md.k==='new')?`<u class="${md.k}"></u>`:'';
 return`<div class="${cls}"><b>${num}</b>${o.mm&&!o.mini?`<i>${md.txt}</i>`:''}${moon}${ev?'<s></s>':''}</div>`;}
function monthGrid(y,m,o={}){
 const ws=o.ws||0,cells=monthCells(y,m,ws),rows=cells.length/7,hh=o.hh||26,lang=o.lang||'both';
 const heads=[0,1,2,3,4,5,6].map(i=>{const w=(i+ws)%7;const t=lang==='en'?EN_WD[w]:lang==='both'&&!o.mini?`${MM_WD[w]}<em>${EN_WD[w]}</em>`:MM_WD[w];return`<div class="wh${w===0?' su':''}">${t}</div>`;}).join('');
 return`<div class="cg ${o.cls||''}" style="grid-template-rows:${hh}px repeat(${rows},1fr)">${heads}${cells.map(d=>cellHtml(y,m,d,{...o,lang})).join('')}</div>`;}

function pgMoon(o={}){const y=2027,m=0;const g=uid();
 const stars=[[40,50],[120,30],[210,70],[300,26],[380,60],[470,34],[540,80],[70,120],[560,150],[20,200],[580,240],[510,20],[330,110]].map(([x,yy],i)=>`<circle cx="${x}" cy="${yy}" r="${i%3?1:1.6}" fill="#fff" opacity="${.35+(i%4)*.15}"/>`).join('');

/* ===== prototype ===== */
(function(){
 const box=document.getElementById('protoPhone'),steps=[...document.querySelectorAll('#steps li')];let cur='home',timer=null;
 const stepOf=id=>STEPS.findIndex(s=>s[2].includes(id));
 function paint(id){const k=stepOf(id);steps.forEach((li,i)=>{li.classList.toggle('on',i===k);li.classList.toggle('done',i<k);});}
 function go(id){clearInterval(timer);cur=id;if(id==='progress'){runProgress();return;}box.innerHTML=PROTO[id]();paint(id);}
 function runProgress(){let n=1;paint('progress');const tick=()=>{box.innerHTML=progressScreen(n);if(n>=12){clearInterval(timer);setTimeout(()=>{if(cur==='progress')go('done');},500);}n++;};tick();timer=setInterval(tick,330);}
 box.addEventListener('click',e=>{
  const c=e.target.closest('[data-go]');if(!c)return;const id=c.dataset.go;
  if(id==='progress'||PROTO[id]){e.preventDefault();go(id);}
  else if(id==='editorSel'){go('editorSel');}
  });
 // progress -> cancel goes back to export sheet
 box.addEventListener('click',e=>{if(cur==='progress'&&e.target.closest('.dlg .btn.out')){go('export');}});
 steps.forEach(li=>li.addEventListener('click',()=>go(STEPS[+li.dataset.step][2][0])));
 document.getElementById('protoReset').addEventListener('click',()=>go('home'));
 go('home');
})();

/* ===== small interactions everywhere ===== */
document.addEventListener('click',e=>{
 const seg=e.target.closest('[data-seg]');if(seg){[...seg.parentNode.children].forEach(c=>c.classList.remove('on'));seg.classList.add('on');return;}
 const tg=e.target.closest('[data-toggle]');if(tg){tg.classList.toggle('on');return;}
 const ch=e.target.closest('[data-chip]');if(ch){ch.classList.toggle('on');return;}
 const tab=e.target.closest('[data-tab]');
 if(tab){const sheet=tab.closest('.isheet'),panes=sheet&&sheet.querySelector('[data-panes]');if(!panes)return;
  [...tab.parentNode.children].forEach(c=>c.classList.remove('on'));tab.classList.add('on');
  [...panes.children].forEach((p,i)=>p.classList.toggle('on',i===+tab.dataset.tab));}
});

/* ===== theme + accent ===== */
const ACC={Jade:['#0E6B5C','#5CCBB1'],Lacquer:['#9E2B25','#F29A90'],Indigo:['#3F51B5','#AEB9FF'],Saffron:['#A5650F','#F2BE68']};
let mode='light',acc='Jade';
function applyTheme(){const r=document.documentElement;r.dataset.theme=mode;r.style.setProperty('--primary',ACC[acc][mode==='dark'?1:0]);r.style.setProperty('--on-primary',mode==='dark'?'#0B1512':'#fff');
 document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));document.querySelectorAll('[data-acc]').forEach(b=>b.classList.toggle('on',b.dataset.acc===acc));}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;applyTheme();}));
document.getElementById('swatches').innerHTML=Object.entries(ACC).map(([n,[c]])=>`<button data-acc="${n}" style="background:${c}" aria-label="${n} accent" title="${n}"></button>`).join('');
document.querySelectorAll('[data-acc]').forEach(b=>b.addEventListener('click',()=>{acc=b.dataset.acc;applyTheme();}));
applyTheme();

(function(){const links=[...document.querySelectorAll('[data-nav]')];
 const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle('cur',l.dataset.nav===e.target.id));}});},{rootMargin:'-20% 0px -70% 0px'});
 SECTIONS.forEach(([id])=>{const el=document.getElementById(id);if(el)io.observe(el);});})();
