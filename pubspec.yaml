
name: myanmar_calendar_workspace
description: Myanmar Calendar Application Workspace
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0

# Workspace configuration
workspace:
  - packages/core
  - packages/data
  - packages/localizations
  - packages/features/calendar
  - packages/features/views
  - packages/features/converter
  - packages/features/settings
  - packages/features/notes
  - packages/features/events
  - packages/features/home_widgets
  - packages/features/firebase_analytics_app
  - apps/myanmar_calendar

# Workspace-level dependencies (shared across all packages)
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
