name: data
description: "Data layer with Drift database for Myanmar Calendar"
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # Core package
  core:
    path: ../core

  # Database
  drift: ^2.28.2
  drift_dev: ^2.28.3
  drift_flutter: ^0.2.8
  sqlite3_flutter_libs: ^0.5.39
  sqlite3: ^2.4.6

  # Path
  path_provider: ^2.1.5
  path: ^1.9.1

  # DI
  get_it: ^8.2.0
  injectable: ^2.5.1

  # Utilities
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.8.0
  injectable_generator: ^2.9.0
