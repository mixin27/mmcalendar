name: home_widgets
description: "Home screen widgets feature for Myanmar Calendar"
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # Core packages
  shared_core:
    path: ../../shared/core
  shared_ui_kit:
    path: ../../shared/ui_kit
  integrations_database:
    path: ../../integrations/database

  # Myanmar calendar
  flutter_mmcalendar: ^3.3.0

  # State management
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Utilities
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  go_router: ^16.2.4

  # Widget packages
  home_widget: ^0.8.0
  shared_preferences: ^2.5.3
  workmanager: ^0.8.0

  # Dependency injection
  get_it: ^8.2.0
  injectable: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.8.0
  injectable_generator: ^2.9.0
