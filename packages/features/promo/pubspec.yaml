name: promo
description: "Promo carousel feature for onboarding, feature announcements, and personalized promotions."
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # Promo carousel package
  promo_carousel: ^1.2.1

  # Navigation
  go_router: ^16.2.4

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Storage
  shared_preferences: ^2.5.4

  # Utilities
  package_info_plus: ^9.0.0
  device_info_plus: ^11.2.0
  get_it: ^8.2.0

  # Internal packages
  shared_core:
    path: ../../shared/core
  shared_ui_kit:
    path: ../../shared/ui_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

