name: settings
description: "Settings feature for app configuration"
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # Core packages
  shared_core:
    path: ../../shared/core
  shared_ui_kit:
    path: ../../shared/ui_kit
  integrations_database:
    path: ../../integrations/database
  shared_localizations:
    path: ../../shared/localizations
  promo:
    path: ../promo

  home_widgets:
    path: ../home_widgets

  # Myanmar Calendar Package
  flutter_mmcalendar: ^3.3.0

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7
  shared_preferences: ^2.5.3

  # Navigation
  go_router: ^16.2.4

  # Functional Programming
  dartz: ^0.10.1

  # State Management
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1

  # Dependency Injection
  get_it: ^8.2.0
  injectable: ^2.5.2
  drift: ^2.28.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.8.0
  injectable_generator: ^2.9.0
