name: views
description: "Calendar views feature (Year, Week, Day)"
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # Core packages
  core:
    path: ../../core
  data:
    path: ../../data
  localizations:
    path: ../../localizations
  calendar:
    path: ../calendar
  firebase_analytics_app:
    path: ../firebase_analytics_app
  settings:
    path: ../settings

  # Myanmar Calendar Package
  flutter_mmcalendar: ^3.2.2

  # State Management
  bloc: ^9.0.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Functional Programming
  dartz: ^0.10.1

  # Dependency Injection
  get_it: ^8.2.0
  injectable: ^2.5.2

  # Utilities
  intl: ^0.20.0
  go_router: ^16.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.8.0
  injectable_generator: ^2.9.0
