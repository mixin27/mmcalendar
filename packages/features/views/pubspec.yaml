name: views
description: "Calendar views feature (Year, Week, Day)"
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # Core packages
  shared_core:
    path: ../../shared/core
  shared_ui_kit:
    path: ../../shared/ui_kit
  integrations_database:
    path: ../../integrations/database
  shared_localizations:
    path: ../../shared/localizations

  # Myanmar Calendar Package
  myanmar_calendar_dart: ^2.0.1
  flutter_mmcalendar: ^3.3.1

  # State Management
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Functional Programming
  dartz: ^0.10.1

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Utilities
  intl: ^0.20.0
  go_router: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner:
  injectable_generator: ^3.1.3
