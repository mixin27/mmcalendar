name: core
description: "Core utilities, theme system, and event bus for Myanmar Calendar"
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # State Management
  equatable: ^2.0.7

  # Functional Programming
  dartz: ^0.10.1

  # Dependency Injection
  get_it: ^8.2.0
  injectable: ^2.5.2

  # Event Bus
  event_bus: ^2.0.1

  # UI
  google_fonts: ^6.3.2

  # Utilities
  intl: ^0.20.0
  flutter_mmcalendar: ^3.2.0
  markdown_widget: ^2.3.2+8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.8.0
  injectable_generator: ^2.9.0
