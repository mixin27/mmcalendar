name: shared_ui_kit
description: Shared UI kit facade for reusable themes and widgets.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  shared_core:
    path: ../core
  shared_moon:
    path: ../moon
  equatable: ^2.1.0
  markdown_widget: ^2.3.2+8
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  alchemist: ^0.14.1

flutter:
  assets:
    - assets/fonts/padauk/OFL.txt
    - assets/fonts/inter/OFL.txt
  fonts:
    # Latin text and numbers. One variable file: Flutter maps FontWeight to
    # its wght axis.
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
    # Myanmar text (SIL Padauk), used as Inter's fallback.
    - family: Padauk
      fonts:
        - asset: assets/fonts/padauk/Padauk-Regular.ttf
        - asset: assets/fonts/padauk/Padauk-Bold.ttf
          weight: 700
